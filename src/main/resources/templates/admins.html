<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Leader Page</title>
	<link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">
</head>
<body>
<div class="container">
	<div><h2>Duc PQ Company Admin Page</h2></div>
	<hr>
	<div class="mb-3">Welcome to Duc PQ company admin page!</div>
	<div class="mb-3">
		User: <span sec:authentication="principal.username"></span>
	</div>
	<div class="mb-3">
		User: <span sec:authentication="principal.authorities"></span>
	</div>
	<hr>
	<div class="mb-3">
		<a th:href="@{/}">Home page</a>
	</div>
	<div class="mb-3" sec:authorize="hasRole('ROLE_MANAGER')">
		<a th:href="@{/leaders}">Leadership Meeting</a> (Only for Manager peeps)
	</div>
	<form action="#" method="post" th:action="@{/logout}">
		<input class="btn btn-danger" type="submit" value="Logout">
	</form>
</div>
</body>
<script crossorigin="anonymous"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
