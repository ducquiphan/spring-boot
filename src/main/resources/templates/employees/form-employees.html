<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Employee Directory</title>
	<link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">
</head>
<body>
<div class="container">
	<div>
		<h3>Employee Form</h3>
	</div>
	<hr>
	<form action="#" method="post" th:action="@{/employees/save}" th:object="${employee}">
		<input class="form-control" th:field="${employee.id}" type="hidden">
		<div class="mb-3 w-25">
			<label for="firstName">First name:</label>
			<input class="form-control" id="firstName" th:field="${employee.firstName}">
		</div>
		<div class="mb-3 w-25">
			<label for="lastName">Last name:</label>
			<input class="form-control" id="lastName" th:field="${employee.lastName}">
		</div>
		<div class="mb-3 w-25">
			<label for="email">Email:</label>
			<input class="form-control" id="email" th:field="${employee.email}">
		</div>
		<div>
			<button class="btn btn-info col-2" type="submit">Save</button>
		</div>
	</form>
	<hr>
	<a th:href="@{/employees/list}">Back to Employees List</a>
</div>
</body>
<script crossorigin="anonymous"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
